# Independent Feishu role-bot Worker on the Workers Free plan.
# Secrets (wrangler secret put; never commit values):
#   FEISHU_APP_ID, FEISHU_APP_SECRET, FEISHU_VERIFICATION_TOKEN
#   FEISHU_ENCRYPT_KEY          optional; omit while Feishu encryption is off
#   GITHUB_TOKEN                fine-grained, this repo, Issues read/write
#   GITHUB_WEBHOOK_SECRET       HMAC secret for POST /github/webhook
# Public var (not a secret): ALLOWED_CHAT_IDS = comma-separated Feishu group chat_ids
# allowed to create 需求 issues and (if enabled) optional LLM chat. Fail-closed
# when unset/empty. Set the partner group id after merge in [vars] or
# src/config.mjs allowedChatIds.
# Optional LLM chat is OFF unless ALL of LLM_BASE_URL, LLM_MODEL, and
# LLM_API_KEY are set. Example vars (keep commented to leave LLM off):
#   [vars]
#   LLM_BASE_URL = "https://api.openai.com/v1"
#   LLM_MODEL = "gpt-4o-mini"
#   LLM_DAILY_LIMIT = "200"
#   LLM_TIMEOUT_MS = "9000"
# Put the key only via: wrangler secret put LLM_API_KEY
# Never commit an API key value.
name = "feishu-bot"
main = "src/worker.mjs"
compatibility_date = "2026-10-15"
workers_dev = true
keep_vars = true

[[kv_namespaces]]
binding = "BOT_KV"
id = "8f0f016240cb488e979429918bf8795b"

# Every 10 minutes, retry forward emails that failed all in-flight attempts (see README).
[triggers]
crons = ["*/10 * * * *"]
