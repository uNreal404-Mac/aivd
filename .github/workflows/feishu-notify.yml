name: Feishu notify

on:
  push:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, assigned, unassigned, closed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out notification code
        uses: actions/checkout@v4
        with:
          # On a PR, use the trusted default-branch SHA, never the PR head.
          ref: ${{ contains(fromJSON('["push","pull_request_target"]'), github.event_name) && github.sha || format('refs/heads/{0}', github.event.repository.default_branch) }}
          persist-credentials: false
      - name: Send repository update to Feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: node scripts/feishu-repository-event.mjs
