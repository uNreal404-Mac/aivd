# Outbound Feishu custom-bot notifications.
#   - push to main            -> "网站进度" card (deploy)
#   - PR opened / ready       -> "新的改动待审核" card (activity)
#   - issue opened            -> "新的问题 / 报告" card (activity)
# Missing FEISHU_WEBHOOK_URL skips the step with success (does not fail CI).
#
# PR events use pull_request_target so PRs from forks can also read the secret.
# This is safe here because the job checks out the base branch only and never
# runs code from the PR; it only reads the PR title/author/link from the event.
name: Feishu notify

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  deploy:
    name: Notify Feishu of production deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Post deploy card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: node scripts/feishu-notify.mjs deploy

  activity:
    name: Notify Feishu of new PR or issue
    if: github.event_name == 'pull_request_target' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Check out base branch (never the PR's code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post activity card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: node scripts/feishu-notify.mjs activity
