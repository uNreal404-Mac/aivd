# Cursor DreamUtopia clone (NOT pikbo, NOT magicremover-clone).
name = "dreamutopia-clone"
compatibility_date = "2026-01-01"
pages_build_output_dir = "out"

# Bindings used by Pages git deploys.
[[d1_databases]]
binding = "DB"
database_name = "dreamutopia-db"
database_id = "148c47fa-55da-4423-b031-1a74e4216014"

[[kv_namespaces]]
binding = "SESSIONS"
id = "6b2dbe20ae95452f8f22b98f0ce6196e"

# Optional for public imageUrl generate; required for POST /api/upload (workspace file picker).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "dreamutopia-media"

# Secrets (Pages dashboard / wrangler pages secret):
#   KIE_API_KEY
#   KIE_WEBHOOK_HMAC_KEY                   (optional; kie.ai Settings → webhookHmacKey)
#   GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET       (Google OAuth)\n#   GOOGLE_REDIRECT_URI                            (optional; defaults to /api/auth/google/callback)\n#   STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET      (paid credits)
#   Webhook: https://dreamutopia-clone.pages.dev/api/stripe/webhook  (checkout.session.completed)
#   D1: npx wrangler d1 execute dreamutopia-db --remote --file=migrations/005_stripe_sessions.sql
#   RESEND_API_KEY + MAIL_FROM                 (password reset + welcome email)
#
# GENERATION_ENABLED: only the exact string "true" opens /api/generate, /api/upload, and /api/upload-ticket.
# Unset / false / anything else → 503 暂未开放 (no KIE call, no credit deduct, no R2 write).

[vars]
GENERATION_ENABLED = "false"
GOOGLE_REDIRECT_URI = "https://dreamutopia-clone.pages.dev/api/auth/google/callback"
